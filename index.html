<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="refresh" content="1.2;url=/home">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARISH YETU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bur:#6E1725;--bur2:#5A111D;--bur3:#8A2434;--gold:#C9A227;--gold2:#A98A1B;
  --ivory:#F7F3E8;--obs:#111315;--navy:#182A3A;--green:#1E6B4F;
  --ink:#23262A;--grey:#8B8A84;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif;font-weight:500;color:var(--ink);
  background:
    radial-gradient(circle at 50% 40%, #8A2434 0%, #6E1725 45%, #3D0D15 100%);
  display:grid;place-items:center;min-height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* soft vignette + inner glow */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, rgba(201,162,39,.18) 0%, transparent 55%),
             radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.55) 0%, transparent 60%);
}
/* subtle floating dust */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,230,170,.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 60%, rgba(255,230,170,.55) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 45% 80%, rgba(255,230,170,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 85% 25%, rgba(255,230,170,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 12% 75%, rgba(255,230,170,.4) 50%, transparent 51%);
  animation:float 12s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}

.stage{
  position:relative;z-index:2;text-align:center;padding:32px 24px;
  max-width:720px;width:100%;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(24px) scale(.96)}
  to{opacity:1;transform:none}
}

/* ============ ICON ROW: candle · bible · fire ============ */
.icons{
  display:flex;justify-content:center;align-items:flex-end;gap:clamp(20px,5vw,54px);
  margin-bottom:34px;
}
.ico{position:relative;display:flex;flex-direction:column;align-items:center}

/* ---- CANDLE ---- */
.candle .wax{
  width:16px;height:64px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,#FBF6E4 0%,#EFE6C8 55%,#D9CDA6 100%);
  box-shadow:inset -4px 0 0 rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.35);
  position:relative;
}
.candle .wax::before{ /* drip */
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:8px;border-radius:50%;background:#FBF6E4;
  box-shadow:0 2px 4px rgba(0,0,0,.15);
}
.candle .holder{
  width:44px;height:10px;border-radius:4px;margin-top:2px;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold2) 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
.candle .flame{
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:14px;height:26px;
  background:radial-gradient(circle at 50% 70%, #FFF3B0 0%, #FFC850 40%, #FF8A1E 70%, rgba(255,80,0,0) 100%);
  border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  filter:blur(.4px);
  animation:flicker 1.4s ease-in-out infinite;
  transform-origin:50% 100%;
}
.candle .flame::before{
  content:"";position:absolute;inset:35% 35% 15% 35%;
  background:radial-gradient(circle,#FFFFFF 0%,#FFE89A 60%,transparent 100%);
  border-radius:50%;filter:blur(1px);
}
.candle .halo{
  position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  width:80px;height:80px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,190,80,.35) 0%,transparent 60%);
  animation:halo 2.4s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{transform:translateX(-50%) scale(1) rotate(-1deg)}
  25%{transform:translateX(-50%) scale(1.06,.96) rotate(2deg)}
  50%{transform:translateX(-50%) scale(.96,1.05) rotate(-2deg)}
  75%{transform:translateX(-50%) scale(1.03,.98) rotate(1deg)}
}
@keyframes halo{
  0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}
  50%{opacity:.9;transform:translateX(-50%) scale(1.15)}
}

/* ---- BIBLE ---- */
.bible{position:relative;perspective:600px}
.bible .book{
  width:74px;height:56px;position:relative;
  transform:rotateX(8deg) rotateZ(-2deg);
  animation:book 4s ease-in-out infinite;
}
.bible .cover{
  position:absolute;inset:0;border-radius:4px 8px 8px 4px;
  background:linear-gradient(135deg,#7A1B29 0%,#5A111D 100%);
  box-shadow:
    inset 0 0 0 2px var(--gold),
    0 8px 20px rgba(0,0,0,.5);
}
.bible .pages{
  position:absolute;top:5px;bottom:5px;right:4px;width:6px;
  background:repeating-linear-gradient(180deg,#FBF6E4 0 1px,#E8DFC2 1px 2px);
  border-radius:0 4px 4px 0;
}
.bible .cross{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:26px;
}
.bible .cross::before,
.bible .cross::after{
  content:"";position:absolute;background:var(--gold);border-radius:1px;
  box-shadow:0 0 6px rgba(201,162,39,.7);
}
.bible .cross::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
.bible .cross::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}
@keyframes book{
  0%,100%{transform:rotateX(8deg) rotateZ(-2deg) translateY(0)}
  50%{transform:rotateX(8deg) rotateZ(-2deg) translateY(-4px)}
}

/* ---- FIRE / FLAME CLUSTER ---- */
.fire{width:60px;height:70px;position:relative}
.fire i{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  border-radius:50% 50% 30% 30%/70% 70% 30% 30%;
  filter:blur(.6px);
}
.fire i:nth-child(1){
  width:44px;height:60px;
  background:radial-gradient(circle at 50% 75%, #FFE9A6 0%, #FFB43A 40%, #E85A0E 75%, rgba(180,40,0,0) 100%);
  animation:fire 1.3s ease-in-out infinite;
}
.fire i:nth-child(2){
  width:26px;height:40px;
  background:radial-gradient(circle at 50% 75%, #FFFFFF 0%, #FFDD70 50%, #FF8A1E 85%, transparent 100%);
  animation:fire 1.3s ease-in-out infinite reverse;
}
.fire i:nth-child(3){
  width:12px;height:20px;
  background:radial-gradient(circle,#FFFFFF 0%,#FFF3B0 70%,transparent 100%);
  animation:fire 1s ease-in-out infinite;
}
@keyframes fire{
  0%,100%{transform:translateX(-50%) scale(1,1) skewX(0deg)}
  25%{transform:translateX(-50%) scale(.94,1.08) skewX(4deg)}
  50%{transform:translateX(-50%) scale(1.06,.94) skewX(-3deg)}
  75%{transform:translateX(-50%) scale(.97,1.05) skewX(2deg)}
}

/* ============ WORDING ============ */
.brand{
  font-size:clamp(11px,1.4vw,13px);font-weight:800;letter-spacing:.35em;
  color:var(--gold);text-transform:uppercase;margin-bottom:14px;
  animation:fade 1s ease .2s both;
}
.title{
  font-size:clamp(24px,4.2vw,40px);font-weight:800;line-height:1.15;
  color:#FFF7E6;letter-spacing:-.01em;
  text-shadow:0 4px 24px rgba(0,0,0,.4),0 0 40px rgba(201,162,39,.25);
  animation:fade 1s ease .35s both;
}
.title span{color:var(--gold)}
.sub{
  margin-top:14px;font-size:clamp(13px,1.6vw,15px);font-weight:600;
  color:#E8CFC9;letter-spacing:.02em;
  animation:fade 1s ease .5s both;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ DIVIDER ============ */
.div{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:26px auto 22px;max-width:340px;
  animation:fade 1s ease .6s both;
}
.div i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.div b{
  width:8px;height:8px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px var(--gold);animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}

/* ============ PROGRESS / LOADER ============ */
.loader{
  display:inline-flex;align-items:center;gap:12px;
  padding:10px 20px;border-radius:99px;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.35);
  backdrop-filter:blur(8px);
  animation:fade 1s ease .75s both;
}
.loader .dots{display:flex;gap:5px}
.loader .dots i{
  width:7px;height:7px;border-radius:50%;background:var(--gold);
  animation:dot 1.4s ease-in-out infinite;
}
.loader .dots i:nth-child(2){animation-delay:.2s;background:#E5C55A}
.loader .dots i:nth-child(3){animation-delay:.4s;background:#FFE9A6}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.loader span{font-size:12.5px;font-weight:700;color:#F3E6E8;letter-spacing:.06em}

/* ============ FALLBACK LINK ============ */
.fallback{
  margin-top:28px;font-size:12px;color:#B8A6A9;animation:fade 1s ease 1s both;
}
.fallback a{
  color:var(--gold);font-weight:700;text-decoration:none;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.fallback a:hover{border-bottom-color:var(--gold)}

@media (max-width:520px){
  .icons{gap:22px}
  .candle .wax{height:52px;width:14px}
  .candle .flame{width:12px;height:22px;top:-26px}
  .bible .book{width:60px;height:46px}
  .fire{width:48px;height:56px}
  .fire i:nth-child(1){width:36px;height:48px}
  .fire i:nth-child(2){width:22px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head><body>

<main class="stage">

  <div class="icons">
    <!-- CANDLE -->
    <div class="ico candle">
      <div class="halo"></div>
      <div class="flame"></div>
      <div class="wax"></div>
      <div class="holder"></div>
    </div>

    <!-- BIBLE -->
    <div class="ico bible">
      <div class="book">
        <div class="cover"></div>
        <div class="pages"></div>
        <div class="cross"></div>
      </div>
    </div>

    <!-- FIRE -->
    <div class="ico fire">
      <i></i><i></i><i></i>
    </div>
  </div>

  <div class="brand">Parish Yetu</div>
  <h1 class="title">Church Management <span>System</span></h1>
  <p class="sub">Entering a place of worship, order &amp; stewardship</p>

  <div class="div"><i></i><b></b><i></i></div>

  <div class="loader">
    <div class="dots"><i></i><i></i><i></i></div>
    <span>PREPARING PARISH YETU…</span>
  </div>

  <p class="fallback">
    Not redirected? <a href="/home">Continue to Parish Yetu →</a>
  </p>

</main>

</body></html>
